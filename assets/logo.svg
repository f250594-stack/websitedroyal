<svg width="900" height="1000" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D9A4"/>
      <stop offset="45%" stop-color="#C9A054"/>
      <stop offset="100%" stop-color="#8C6A2F"/>
    </linearGradient>
  </defs>

  <!-- outer rings -->
  <circle cx="450" cy="380" r="335" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="450" cy="380" r="308" fill="none" stroke="url(#gold)" stroke-width="1.25"/>

  <!-- monogram -->
  <g font-family="EB Garamond, Georgia, 'Times New Roman', serif" fill="url(#gold)" text-anchor="middle">
    <text x="360" y="470" font-size="310" font-weight="600">D</text>
    <text x="545" y="470" font-size="310" font-weight="600">R</text>
  </g>
  <line x1="450" y1="248" x2="450" y2="278" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="450" cy="238" r="3.5" fill="url(#gold)"/>

  <!-- wordmark -->
  <text x="450" y="800" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="500"
        letter-spacing="14" fill="url(#gold)" text-anchor="middle">D ROYAL</text>
  <text x="450" y="855" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="500"
        letter-spacing="14" fill="url(#gold)" text-anchor="middle">FRAGRANCE</text>

  <!-- small rule + tagline -->
  <line x1="380" y1="895" x2="520" y2="895" stroke="url(#gold)" stroke-width="1"/>
  <text x="450" y="930" font-family="Montserrat, Arial, sans-serif" font-size="19" font-weight="400"
        letter-spacing="6" fill="url(#gold)" text-anchor="middle" opacity="0.85">PAKISTAN</text>
</svg>
